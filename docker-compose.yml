services:
  postgres:
    image: postgres:16
    container_name: forge_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev_password

    ports:
      - "5432:5432"

    volumes:
      - forge_postgres_data:/var/lib/postgresql/data

volumes:
  forge_postgres_data: